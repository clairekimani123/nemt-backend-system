services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nemt
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nemt"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mailpit:                       # catches all outgoing email; UI at http://localhost:8025
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
  minio:                         # S3-compatible storage (used from the Documents phase)
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345}
    ports: ["9000:9000", "9001:9001"]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nemt_app:app_dev_pw@db:5432/nemt
      DATABASE_OWNER_URL: postgresql+asyncpg://nemt_owner:owner_dev_pw@db:5432/nemt
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./:/code"]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nemt_app:app_dev_pw@db:5432/nemt
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
    command: celery -A app.workers.celery_app worker --loglevel=info
    volumes: ["./:/code"]
    depends_on: [redis, db]
volumes:
  pgdata: